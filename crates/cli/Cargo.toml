[package]
name = "cse-cli"
description = "Command-line interface to CSE Trader: market data, structure markers, alerts, portfolios; JSON output for scripts and AI agents"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "cse"
path = "src/main.rs"

[dependencies]
cse-service.workspace = true
clap = { version = "4", features = ["derive", "env"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
cse-client.workspace = true
cse-storage.workspace = true
chrono.workspace = true
