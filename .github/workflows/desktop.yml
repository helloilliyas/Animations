# Builds the CSE Trader desktop app for Windows, macOS and Linux.
# Installers appear as downloadable artifacts on each run; pushing a tag like
# desktop-v0.9.7 also attaches them to a GitHub release.
name: Desktop app

on:
  workflow_dispatch:
  push:
    tags: ["desktop-v*"]
    branches: [main, "claude/**"]
    paths: ["app/**", "crates/**", ".github/workflows/desktop.yml"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            args: --bundles nsis,msi
            out: app/src-tauri/target/release/bundle
          - name: macos
            os: macos-latest
            args: --target universal-apple-darwin --bundles dmg
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            out: app/src-tauri/target/universal-apple-darwin/release/bundle
          - name: linux
            os: ubuntu-22.04
            args: --bundles deb,appimage
            out: app/src-tauri/target/release/bundle
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux libraries
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Tauri CLI
        run: npm install -g @tauri-apps/cli@2

      - name: Build
        working-directory: app/src-tauri
        run: tauri build ${{ matrix.args }}

      - uses: actions/upload-artifact@v4
        with:
          name: cse-trader-${{ matrix.name }}
          path: |
            ${{ matrix.out }}/nsis/*.exe
            ${{ matrix.out }}/msi/*.msi
            ${{ matrix.out }}/dmg/*.dmg
            ${{ matrix.out }}/deb/*.deb
            ${{ matrix.out }}/appimage/*.AppImage
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.out }}/nsis/*.exe
            ${{ matrix.out }}/msi/*.msi
            ${{ matrix.out }}/dmg/*.dmg
            ${{ matrix.out }}/deb/*.deb
            ${{ matrix.out }}/appimage/*.AppImage
