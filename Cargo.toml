[workspace]
resolver = "2"
exclude = ["app/src-tauri"]
members = ["crates/core", "crates/cse-client", "crates/engine", "crates/service", "crates/storage", "crates/dev-server"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"
publish = false

[workspace.dependencies]
cse-core = { path = "crates/core" }
cse-engine = { path = "crates/engine" }
cse-storage = { path = "crates/storage" }
cse-client = { path = "crates/cse-client" }
cse-service = { path = "crates/service" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
rust_decimal = { version = "1", features = ["serde-with-float", "serde-with-str"] }
rust_decimal_macros = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
